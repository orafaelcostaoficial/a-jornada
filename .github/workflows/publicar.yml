# Publica no GitHub Pages:
#   branch main  → https://<conta>.github.io/a-jornada/         (app de verdade)
#   branch teste → https://<conta>.github.io/a-jornada/teste/   (para testar no celular antes)
# Em Settings → Pages, a fonte deve ser "GitHub Actions".
name: Publicar
on:
  push:
    branches: [main, teste]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write
concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  # O ambiente github-pages só aceita publicar a partir da main. Um push na teste
  # apenas dispara a publicação na main, que monta o site com as duas branches.
  disparar:
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run publicar.yml --ref main -R "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
  publicar:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: _site
      - name: Canal de teste
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}" teste >/dev/null; then
            git clone --depth 1 --branch teste "https://github.com/${{ github.repository }}" _teste
            rm -rf _teste/.git _teste/.github
            mv _teste _site/teste
            # O canal de teste vira um app separado, com outro nome e ícone, para não se confundir com o oficial.
            python3 - <<'PY'
          import json
          p = '_site/teste/manifest.webmanifest'
          m = json.load(open(p, encoding='utf-8'))
          m.update(name='A Jornada · TESTE', short_name='Jornada TESTE', id='./?canal=teste', theme_color='#c8283a')
          for i in m['icons']:
              i['src'] = i['src'].replace('icon-', 'teste-')
          json.dump(m, open(p, 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          PY
          fi
          rm -rf _site/.git _site/.github
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
