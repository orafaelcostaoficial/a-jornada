# Publica o app oficial no GitHub Pages:
#   branch main → https://<conta>.github.io/a-jornada/   (app de verdade)
# O canal de teste é outro app, em outro endereço (https://<conta>.github.io/a-jornada-teste/),
# publicado a partir da branch `teste` por ferramentas/publicar_teste.sh. Fica fora do endereço do
# oficial para o Android não tratar os dois como o mesmo app instalado.
# O endereço antigo /a-jornada/teste/ só redireciona para o novo.
# Em Settings → Pages, a fonte deve ser "GitHub Actions".
name: Publicar
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-main
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: _site
      - name: Endereço antigo do teste redireciona para o novo
        run: |
          mkdir -p _site/teste
          cat > _site/teste/index.html <<'HTML'
          <!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>A Jornada · TESTE mudou de endereço</title>
          <script>location.replace('https://orafaelcostaoficial.github.io/a-jornada-teste/' + location.hash);</script>
          </head><body style="font-family:sans-serif;padding:24px">
          <p>O canal de teste mudou para <a href="https://orafaelcostaoficial.github.io/a-jornada-teste/">orafaelcostaoficial.github.io/a-jornada-teste</a>.</p>
          </body></html>
          HTML
          rm -rf _site/.git _site/.github
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
